name: Release Lite Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

concurrency:
  group: release-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 1. Build frontend once, share as artifact ──
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 2. Build Desktop APP for Windows only (Wails + NSIS) ──
  build-desktop-app:
    needs: build-frontend
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
      GOSUMDB: off
      GONOSUMDB: "*"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Go caches
        run: |
          go clean -modcache
          go clean -cache
        shell: bash

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS (Windows)
        run: choco install nsis -y

      - name: Setup SQLite headers (Windows)
        shell: bash
        run: |
          curl -L -o sqlite-amalgamation.zip https://www.sqlite.org/2024/sqlite-amalgamation-3450100.zip
          powershell -Command "Expand-Archive -Path sqlite-amalgamation.zip -DestinationPath . -Force"
          SQLITE_DIR="$(pwd -W)/sqlite-amalgamation-3450100"
          echo "CGO_CFLAGS=-I${SQLITE_DIR} -Wno-deprecated-declarations" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download Go modules
        shell: bash
        run: |
          cd cmd/desktop
          # 删除 go.sum 中 mysql 驱动的旧（错误）校验记录
          grep -v "go-sql-driver/mysql" go.sum > go.sum.tmp || true
          mv go.sum.tmp go.sum
          # 重新下载并由 Go 计算正确哈希写回 go.sum
          GOFLAGS=-mod=mod go mod tidy
          go mod download
          go mod download github.com/go-sql-driver/mysql
          echo "---- go.sum mysql entries after fix ----"
          grep "go-sql-driver/mysql" go.sum || echo "(none)"


      - name: Pre-compile Go packages (Windows)
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"

          BUILD_TAGS="sqlite_fts5"
          NSIS_FLAG="-nsis"

          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          wails build -clean \
            -tags "${BUILD_TAGS}" \
            -platform "windows/amd64" \
            ${NSIS_FLAG} \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      # ── Windows: NSIS installer includes licenses and corresponding source ──
      - name: Package Windows app
        shell: bash
        run: |
          ARCHIVE="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_windows_amd64"
          INSTALLER="cmd/desktop/build/bin/WeKnora Lite-amd64-installer.exe"
          # Do not publish a bare executable if NSIS was unavailable: the
          # installer also carries the notices/source and supports auto-update.
          test -f "$INSTALLER"
          cp "$INSTALLER" "${ARCHIVE}_setup.exe"
          sha256sum "${ARCHIVE}_setup.exe" > "${ARCHIVE}_setup.exe.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-amd64
          path: |
            WeKnora-Lite-App_*
          retention-days: 3

  # ── 3. Create GitHub Release ──
  release:
    needs: build-desktop-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          cat > notes.md << 'NOTES'
          ## WeKnora Lite ${{ steps.ver.outputs.version }}

          ### 桌面 APP 版（Windows，开箱即用）

          原生桌面应用，内置 Web 服务，双击安装即可运行。

          | 文件 | 平台 |
          |------|------|
          | `WeKnora-Lite-App_*_windows_amd64_setup.exe` | Windows x86_64 (安装包) |

          **首次使用：**
          1. 安装并启动 WeKnora Lite
          2. 配置模型服务（推荐 Ollama: http://localhost:11434，模型 qwen2.5:7b）
          3. 创建知识库并上传文档
          4. 开始提问

          详细文档见 docs/LITE.md。
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --title "WeKnora Lite ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            WeKnora-Lite-App_* || true
